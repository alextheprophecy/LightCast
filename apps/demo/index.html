<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lightcast — relight any photo in the browser</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0b0b0e;
        color: #eee;
        -webkit-text-size-adjust: 100%;
      }
      header {
        padding: 20px 20px 8px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 4px 0 0;
        color: #9aa;
        font-size: 13px;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 12px 16px 48px;
      }
      #dropzone {
        border: 1.5px dashed #3a3a45;
        border-radius: 14px;
        padding: 40px 20px;
        text-align: center;
        color: #9aa;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      #dropzone.drag {
        border-color: #6ea8fe;
        background: #14141a;
      }
      #viewport {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 40vh;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
      }
      #viewport canvas {
        max-width: 100%;
        height: auto;
        display: block;
        touch-action: none;
      }
      #progress {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 24px;
        text-align: center;
        font-size: 13px;
        color: #cdd;
      }
      .bar {
        width: min(260px, 70vw);
        height: 6px;
        border-radius: 3px;
        background: #23232b;
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: var(--pct, 0%);
        background: linear-gradient(90deg, #6ea8fe, #b388ff);
        transition: width 0.2s;
      }
      #controls {
        margin-top: 14px;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        background: #121218;
        border: 1px solid #23232b;
        border-radius: 12px;
        padding: 14px;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        color: #9aa;
      }
      label.toggle-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      input[type='range'] {
        width: 100%;
      }
      input[type='color'] {
        width: 100%;
        height: 30px;
        background: none;
        border: none;
      }
      select {
        background: #1b1b22;
        color: #eee;
        border: 1px solid #2c2c36;
        border-radius: 7px;
        padding: 6px;
      }
      #samples {
        margin: 14px 0 0;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #samples img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        opacity: 0.8;
        border: 2px solid transparent;
      }
      #samples img:hover {
        opacity: 1;
        border-color: #6ea8fe;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        background: #1b1b22;
        color: #eee;
        border: 1px solid #2c2c36;
        border-radius: 7px;
        padding: 7px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        border-color: #6ea8fe;
      }
      .hint {
        font-size: 12px;
        color: #778;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>lightcast</h1>
      <p>
        Relight any photo from a single image — 100% in your browser. Drag the light with your
        finger or mouse.
      </p>
    </header>
    <main>
      <div id="dropzone">
        <strong>Drop a photo</strong> or tap to choose — portraits and product shots work best.
        <input id="file" type="file" accept="image/*" hidden />
      </div>
      <div id="samples"></div>

      <div id="viewport" hidden>
        <div id="progress" hidden>
          <div class="bar"></div>
          <span>Loading…</span>
        </div>
      </div>

      <div id="controls" hidden>
        <label>
          Elevation
          <input id="elevation" type="range" min="0" max="90" value="45" />
        </label>
        <label>
          Intensity
          <input id="intensity" type="range" min="0" max="2" step="0.05" value="1.1" />
        </label>
        <label>
          Ambient
          <input id="ambient" type="range" min="0" max="1" step="0.02" value="0.25" />
        </label>
        <label>
          Specular
          <input id="specular" type="range" min="0" max="1" step="0.02" value="0.3" />
        </label>
        <label>
          Relief
          <input id="relief" type="range" min="0" max="2.5" step="0.05" value="1" />
        </label>
        <label>
          Light color
          <input id="color" type="color" value="#fff3e0" />
        </label>
        <label class="toggle-row">
          <input id="shadows" type="checkbox" checked /> Contact shadows
        </label>
        <label>
          Animation
          <select id="preset">
            <option value="">manual (drag)</option>
            <option value="studio">studio</option>
            <option value="orbit">orbit</option>
            <option value="golden-hour">golden hour</option>
            <option value="flicker">flicker</option>
          </select>
        </label>
        <div class="row" style="grid-column: 1 / -1">
          <button id="reset">Reset light</button>
          <span class="hint">Move the pointer over the image to aim the key light.</span>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
